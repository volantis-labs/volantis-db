[package]
name = "volantis-db-workspace-tests"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lints.rust]
# The path-included FFI test helper gates text fixtures on this cfg value.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("text"))'] }

[[test]]
name = "scaffold_gates"
path = "scaffold_gates.rs"

[[test]]
name = "adversarial_tests"
path = "adversarial_tests.rs"

[[test]]
name = "adversarial_cli"
path = "adversarial_cli.rs"

[[test]]
name = "graph_refinement"
path = "graph_refinement.rs"

[features]
# Opt-in internal graph component campaigns; default artifacts stay unchanged.
graph-cypher = [
    "dep:volantis-db-cypher",
    "volantis-db/graph-cypher",
    "volantis-db-ffi/graph-cypher",
]
# Scoped allocation scheduling for PG16 qualification only.
graph-result-test-support = [
    "graph-cypher",
    "volantis-db-ffi/graph-bindings-test-support",
]

[dependencies]
proptest.workspace = true
rand.workspace = true
rand_chacha.workspace = true
tempfile.workspace = true
volantis-db-adversarial-oracle = { path = "adversarial-oracle", version = "=0.1.0" }
volantis-db = { path = "../crates/volantis-db", version = "=0.1.0", features = ["benchmark-kernels", "test-seams"] }
volantis-db-bench = { path = "../crates/volantis-db-bench", version = "=0.1.0" }
volantis-db-ffi = { path = "../crates/volantis-db-ffi", version = "=0.1.0", features = ["abi-panic-probe"] }

volantis-db-cypher = { path = "../crates/volantis-db-cypher", version = "=0.1.0", optional = true }

[[test]]
name = "graph_fixture"
path = "graph_fixture.rs"
required-features = ["graph-cypher"]

[[bin]]
name = "graph-fixture"
path = "graph_fixture_cli.rs"
required-features = ["graph-cypher"]

[[test]]
name = "graph_search_qualification"
path = "graph_search_qualification.rs"
required-features = ["graph-cypher"]

[[test]]
name = "graph_bindings"
path = "graph_bindings.rs"
required-features = ["graph-result-test-support"]

[[test]]
name = "graph_profile_parity"
path = "graph_profile_parity.rs"
required-features = ["graph-cypher"]

[[test]]
name = "graph_profile_cli"
path = "graph_profile_cli.rs"
required-features = ["graph-cypher"]

[[bin]]
name = "graph-profile"
path = "graph_profile_runner.rs"
required-features = ["graph-cypher"]

[[test]]
name = "graph_workload"
path = "graph_workload.rs"
required-features = ["graph-cypher"]

[[bin]]
name = "graph-workload"
path = "graph_workload_cli.rs"
required-features = ["graph-cypher"]

[dev-dependencies]
volantis-db = { path = "../crates/volantis-db", version = "=0.1.0", features = ["test-seams"] }
