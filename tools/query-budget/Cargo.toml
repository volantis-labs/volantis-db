[package]
name = "query-budget-api"
version = "0.1.0"
edition = "2024"
publish = false

# A separate workspace prevents benchmark/dev features from enabling the
# engine's fault observers in the production API timing control.
[workspace]

[features]
default = []
query-timing = ["volantis-db/query-timing"]

[dependencies]
serde_json = "=1.0.151"
volantis-db = { path = "../../crates/volantis-db" }
volantis-db-text = { path = "../../crates/volantis-db-text" }

[[bin]]
name = "query-budget-api"
path = "../../crates/volantis-db-bench/examples/query-budget.rs"

[profile.bench]
opt-level = 3
debug = true
lto = "fat"
codegen-units = 1
strip = "none"
