[package]
name = "volantis-db-cypher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded internal Cypher syntax frontend for Volantis DB"

[dependencies]
volantis-db = { path = "../volantis-db", version = "=0.1.0", features = ["graph-cypher"] }

[dev-dependencies]
# Tests create and reopen native graph stores through test-only helpers.
volantis-db = { path = "../volantis-db", version = "=0.1.0", features = ["graph-cypher", "test-seams"] }
