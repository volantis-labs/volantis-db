[package]
name = "volantis-db-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
graph-cypher = ["volantis-db/graph-cypher"]
query-timing = ["volantis-db/query-timing"]
text = ["dep:volantis-db-text"]

[dependencies]
libc.workspace = true
serde_json.workspace = true
tempfile.workspace = true
volantis-db = { path = "../volantis-db", version = "=0.1.0", features = ["benchmark-kernels"] }
volantis-db-text = { path = "../volantis-db-text", version = "=0.1.0", optional = true }

[dev-dependencies]
criterion.workspace = true

[[bin]]
name = "graph-bulk-load"
path = "src/bin/graph-bulk-load.rs"
required-features = ["graph-cypher"]

[[bench]]
name = "scaffold"
harness = false

[[example]]
name = "tokenizer-cost"
required-features = ["text"]

[[example]]
name = "query-budget"
required-features = ["text"]

[[bin]]
name = "wal-throughput"
path = "src/bin/wal-throughput.rs"

[[bin]]
name = "text-user-bench"
path = "src/bin/text-user-bench.rs"
required-features = ["text"]
